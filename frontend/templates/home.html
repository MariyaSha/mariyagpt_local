<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>mariyaGPT</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css', v=static_version) }}"
    >
</head>

<body class="login-page">

    <div class="login-card">

        <div class="login-brand">

            <div class="login-logo">
                M
            </div>

            <div>
                <h1>mariyaGPT</h1>
                <p>Your personal AI assistant</p>
            </div>

        </div>

        <div class="login-heading">

            <h2>Let's get started</h2>

            <p>
                Enter your name and choose a model to run locally.
            </p>

        </div>

        <p
            id="setup-error"
            class="error-message login-error"
        ></p>

        <form
            id="setup-form"
            class="login-form"
        >

            <div class="login-field">

                <label for="name">
                    Your name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                    autofocus
                >

            </div>

            <div class="hardware-card">

                <div class="hardware-label">
                    Hardware detected
                </div>

                <div
                    id="hardware-info"
                    class="hardware-value"
                >
                    Detecting hardware...
                </div>

            </div>

            <div class="login-field">

                <label for="model">
                    Model
                </label>

                <select
                    id="model"
                    name="model"
                    required
                    disabled
                >
                    <option value="">
                        Detecting hardware...
                    </option>
                </select>

            </div>

            <div class="model-download">

                <button
                    type="button"
                    id="download-model"
                    class="download-model-button"
                    disabled
                >
                    Checking model...
                </button>

                <div
                    id="download-progress"
                    class="download-progress"
                    hidden
                >

                    <div class="download-progress-track">

                        <div
                            id="download-progress-bar"
                            class="download-progress-bar"
                        ></div>

                    </div>

                    <div class="download-progress-details">

                        <span id="download-status">
                            Preparing download...
                        </span>

                        <span id="download-amount">
                            0 GB / 0 GB
                        </span>

                    </div>

                </div>

                <p
                    id="model-ready"
                    class="model-ready"
                    hidden
                >
                    ✓ Model downloaded and ready.
                </p>

            </div>

            <button
                type="submit"
                id="start-chatting"
                class="login-button"
                disabled
            >
                Start Chatting
            </button>

        </form>

    </div>

    <script>
        window.BACKEND_URL = {{ backend_url | tojson }};
    </script>

    <script
        src="{{ url_for('static', filename='setup.js', v=static_version) }}"
    ></script>

</body>
</html>
